[versions]
# AGP 9.1.0+ is required by Compose UI 1.12.0 (from BOM 2025.12.01). 9.6.0 is
# the latest stable 9.x and needs Gradle 9.x + compileSdk ≥ 37.
agp = "9.5.0"
# Kotlin 2.4.10 is the minimum that can read the stdlib metadata bundled with
# the Compose BOM 2025.12.01 dependencies. AGP 9.5.0 ships with 2.2.0 but will
# defer to this higher declared version.
kotlin = "2.4.10"
composeBom = "2025.12.01"
# 1.14.0+ exist in metadata but not in the repository; 1.13.0 is the latest
# published stable.
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
datastore = "1.3.0"
# OkHttp 5.x switches to kotlin.time.Duration for timeouts and may require
# HttpUrl instead of String for Request.Builder.url(). The app uses the
# default client; fixups will be applied if the build flags them.
okhttp = "5.5.1"
serialization = "1.12.0"
coroutines = "1.11.0"
# Coil 3.1.0 was the first release with DataUriFetcher for base64 data URIs.
# 3.6.x is the latest stable 3.x line.
coil = "3.6.3"
exifinterface = "1.4.2"
junit = "4.13.2"
# Backports the Android 12 splash screen API down to minSdk, so the branded
# cold start is the same on every version the app supports.
splashscreen = "1.0.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-runtime-saveable = { module = "androidx.compose.runtime:runtime-saveable" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
